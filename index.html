<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnChainAuction | Stellar Project Auctions</title>
    <meta name="description" content="A trustless project auction platform built on Stellar Soroban. Transparent bids, automatic settlement, no intermediaries." />
    <meta name="theme-color" content="#0A1628" />
    <meta property="og:title" content="OnChainAuction | Bid on Projects. Settle On-Chain." />
    <meta property="og:description" content="A trustless project auction platform built on Stellar Soroban. Transparent bids, automatic settlement." />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <!-- Theme initializer: runs before React to avoid flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored !== 'light') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
